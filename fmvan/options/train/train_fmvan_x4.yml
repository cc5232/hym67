# general settings
name: train_fmvan_x4
model_type: SRModel
scale: 4
num_gpu: 1
manual_seed: 0


# dataset and data loader settings
datasets:
  train:
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: datasets/DF2K_train_HR_sub.lmdb
    dataroot_lq: datasets/DF2K_train_LR_bicubic_X4_sub.lmdb

    io_backend:
      type: lmdb

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 6
    batch_size_per_gpu: 64
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val_1:
    name: Set5_val
    type: PairedImageDataset
    dataroot_gt: datasets/Set5/set5_hr/
    dataroot_lq: datasets/Set5/LRbicx4/
    io_backend:
      type: disk

  val_2:
    name: Set14_val
    type: PairedImageDataset
    dataroot_gt: datasets/Set14/set14_hr/
    dataroot_lq: datasets/Set14/LRbicx4/
    io_backend:
      type: disk

network_g:
  type: SRnet
  num_feat: 56
  num_block: 10
  upscale: 4

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-3
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [ 1000000 ]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 1000000
  warmup_iter: -1

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
    entity: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500